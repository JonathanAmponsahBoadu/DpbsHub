org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# This machine has 7GB RAM total — Gradle's own heap plus Kotlin/AGP daemon
# processes need to fit alongside it, so keep -Xmx well under physical RAM
# (the previous -Xmx8G exceeded total RAM and reliably crashed the daemon
# with an out-of-memory mmap failure once Firebase's plugins were added).
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
