name: dpbshub
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: 10.3.1
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/bible/en_books.json
    - assets/bible/tw_books.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#17A673"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
